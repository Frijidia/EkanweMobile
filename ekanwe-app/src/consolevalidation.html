<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Console de Validation - Ekanwe</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <!-- EmailJS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/emailjs-com@2.6.4/dist/email.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, white 0%, #C4B6AB 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 24px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #f67011, #C4B6AB);
            color: white;
            padding: 18px 10px 18px 10px;
            text-align: center;
        }

        .header h1 {
            font-size: 2rem;
            margin-bottom: 6px;
        }

        .header p {
            opacity: 0.9;
            font-size: 1rem;
        }

        .main-content {
            display: flex;
            min-height: 60vh;
        }

        .profiles-list {
            width: 40%;
            background: #f8f9fa;
            border-right: 2px solid #e9ecef;
            overflow-y: auto;
            max-height: none;
            min-height: 0;
        }

        .list-header {
            padding: 10px 10px 0 10px;
            background: white;
            color: #343a40;
            position: static;
            border-bottom: none;
        }

        .filter-section {
            background: white;
            padding: 10px 0 10px 0;
            margin: 0 0 10px 0;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
        }

        .filter-tabs {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            overflow-x: auto;
            padding-bottom: 0;
            scrollbar-width: thin;
            justify-content: space-evenly;
            width: 100%;
        }
        .tab {
            flex: 1 1 120px;
            text-align: center;
            padding: 7px 0;
            font-size: 0.95rem;
            min-width: 90px;
        }

        .profile-item {
            padding: 12px 10px;
            border-bottom: 1px solid #dee2e6;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            min-height: 60px;
            word-break: break-word;
        }

        .profile-item:hover {
            background: #e9ecef;
            transform: translateX(5px);
        }

        .profile-item.selected {
            background: #007bff;
            color: white;
        }

        .profile-header {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            gap: 6px 10px;
            margin-bottom: 10px;
            font-size: 1rem;
        }

        .profile-name {
            font-weight: bold;
            font-size: 1rem;
            flex: 1;
            min-width: 0;
        }

        .profile-type, .profile-status {
            margin-top: 4px;
            margin-right: 4px;
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 12px;
            display: inline-block;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .profile-type {
            margin-left: 0;
        }

        .profile-status {
            position: static;
            margin-left: 0;
        }

        .profile-status.status-pending {
            background: #ffeaa7;
            color: #d63031;
        }

        .profile-status.status-validated {
            background: #00b894;
            color: white;
        }

        .profile-status.status-rejected {
            background: #e17055;
            color: white;
        }

        .profile-info {
            font-size: 0.9rem;
            color: #6c757d;
            word-break: break-word;
            overflow-wrap: break-word;
        }

        .profile-details {
            width: 60%;
            padding: 18px 10px 10px 18px;
            overflow-y: auto;
        }

        .no-selection {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #6c757d;
            text-align: center;
        }

        .no-selection .icon {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .details-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #e9ecef;
            flex-wrap: wrap;
            gap: 15px;
        }

        .details-title {
            font-size: 1.8rem;
            color: #343a40;
            margin: 0;
            flex: 1;
            min-width: 0;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
            text-align: center;
            white-space: nowrap;
            font-size: 0.95rem;
        }

        .btn-accept {
            background: #f67011;
            color: white;
        }

        .btn-accept:hover {
            background: #e55a0a;
            transform: translateY(-2px);
        }

        .btn-reject {
            background: #C4B6AB;
            color: white;
        }

        .btn-reject:hover {
            background: #b3a69c;
            transform: translateY(-2px);
        }

        .btn-link {
            background: #f67011;
            color: white;
            font-size: 0.85rem;
            padding: 6px 12px;
        }

        .btn-link:hover {
            background: #e55a0a;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin-top: 20px;
        }

        .info-card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 12px;
            border-left: 4px solid #f67011;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .info-label {
            font-weight: bold;
            color: #495057;
            margin-bottom: 8px;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-value {
            color: #212529;
            font-size: 1rem;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .social-links {
            display: flex;
            gap: 15px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .interest-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .interest-tag {
            background: rgba(246, 112, 17, 0.1);
            color: #f67011;
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: 500;
            white-space: nowrap;
        }

        .stats {
            display: flex;
            justify-content: space-evenly;
            padding: 12px 0;
            background: white;
            color: #343a40;
            margin: 10px 0 0 0;
            border-radius: 10px;
            flex-wrap: wrap;
            gap: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
        }

        .stat-item {
            text-align: center;
            flex: 1;
            min-width: 90px;
            cursor: pointer;
            transition: all 0.3s;
            padding: 6px;
            border-radius: 8px;
        }

        .stat-item:hover {
            background: rgba(246, 112, 17, 0.1);
            transform: translateY(-2px);
        }

        .stat-item.active {
            background: rgba(246, 112, 17, 0.2);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .stat-number {
            font-size: 1.5rem;
            font-weight: bold;
            display: block;
        }

        .stat-label {
            font-size: 0.95rem;
            opacity: 0.8;
        }

        @media (max-width: 900px) {
            .main-content {
                flex-direction: column;
            }
            .profiles-list, .profile-details {
                width: 100%;
            }
            .profile-details {
                padding: 10px 5px 5px 10px;
            }
            .info-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 1.3rem;
            }
            .stat-number {
                font-size: 1.1rem;
            }
            .stat-label {
                font-size: 0.8rem;
            }
            .tab {
                font-size: 0.8rem;
                min-width: 70px;
                padding: 5px 0;
            }
            .profile-header, .profile-name {
                font-size: 0.9rem;
            }
            .info-card {
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 Console de Validation</h1>
            <p>Gestion des profils en attente - Ekanwe</p>
        </div>

        <div class="stats">
            <div class="stat-item" onclick="filterByStatus('pending')" id="stat-pending">
                <span class="stat-number" id="pendingCount">0</span>
                <span class="stat-label">En attente</span>
            </div>
            <div class="stat-item" onclick="filterByStatus('validated')" id="stat-validated">
                <span class="stat-number" id="validatedCount">0</span>
                <span class="stat-label">Validés</span>
            </div>
            <div class="stat-item" onclick="filterByStatus('rejected')" id="stat-rejected">
                <span class="stat-number" id="rejectedCount">0</span>
                <span class="stat-label">Refusés</span>
            </div>
        </div>

        <div class="filter-section">
            <div class="filter-tabs">
                <button class="tab active" onclick="filterProfiles('all')">Tous</button>
                <button class="tab" onclick="filterProfiles('influenceur')">Influenceurs</button>
                <button class="tab" onclick="filterProfiles('commercant')">Commerçants</button>
                <button class="tab" onclick="filterProfiles('pending')">En attente</button>
                <button class="tab" onclick="filterProfiles('validated')">Validés</button>
                <button class="tab" onclick="filterProfiles('rejected')">Refusés</button>
            </div>
        </div>

        <div class="main-content">
            <div class="profiles-list">
                <div class="list-header">
                    <h3>📋 Liste des Profils</h3>
                </div>
                <div id="profilesList">
                    <!-- Les profils seront générés ici -->
                </div>
            </div>

            <div class="profile-details">
                <div class="no-selection" id="noSelection">
                    <div class="icon">👤</div>
                    <h3>Aucun profil sélectionné</h3>
                    <p>Cliquez sur un profil dans la liste pour voir ses détails</p>
                </div>
                <div id="profileDetails" style="display: none;">
                    <!-- Les détails du profil seront affichés ici -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // Initialisation Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDyRgBYPs6qUJpjr9rW4F8nE4s6YwY-g-k",
            authDomain: "ekanwe-app.firebaseapp.com",
            projectId: "ekanwe-app",
            storageBucket: "ekanwe-app.firebasestorage.app",
            messagingSenderId: "177322625777",
            appId: "1:177322625777:web:3e8a67a4d99cf388b13750",
            measurementId: "G-17MSPHGKVV"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Initialisation EmailJS
        emailjs.init('service_9022822');

        let profiles = [];
        let currentFilter = 'all';
        let selectedProfile = null;

        async function fetchProfiles() {
            // Récupère tous les profils (on peut filtrer côté JS ensuite)
            const snapshot = await db.collection('users').get();
            profiles = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            renderProfiles();
        }

        function renderProfiles() {
            const profilesList = document.getElementById('profilesList');
            const filteredProfiles = profiles.filter(profile => {
                if (currentFilter === 'all') return true;
                if (currentFilter === 'influenceur') return profile.role === 'influenceur';
                if (currentFilter === 'commercant') return profile.role === 'commercant';
                if (currentFilter === 'pending') return profile.status === 'en attente';
                if (currentFilter === 'validated') return profile.status === 'valide';
                if (currentFilter === 'rejected') return profile.status === 'refuse';
                return true;
            });
            profilesList.innerHTML = filteredProfiles.map(profile => `
                <div class="profile-item ${selectedProfile?.id === profile.id ? 'selected' : ''}" 
                     onclick="selectProfile('${profile.id}')">
                    <div class="profile-status status-${profile.status}">
                        ${profile.status === 'en attente' ? 'En attente' : 
                          profile.status === 'valide' ? 'Validé' : 'Refusé'}
                    </div>
                    <div class="profile-header">
                        <div class="profile-name">${profile.prenoms || profile.prenom || ''} ${profile.nom || ''}</div>
                        <span class="profile-type ${profile.role}">${profile.role}</span>
                    </div>
                    <div class="profile-info">
                        📞 ${profile.phone || profile.telephone || ''}<br>
                        📅 Inscrit le ${profile.dateCreation ? new Date(profile.dateCreation.seconds*1000).toLocaleDateString('fr-FR') : ''}
                    </div>
                </div>
            `).join('');
            updateStats();
        }

        function updateStats() {
            document.getElementById('pendingCount').textContent = 
                profiles.filter(p => p.status === 'en attente').length;
            document.getElementById('validatedCount').textContent = 
                profiles.filter(p => p.status === 'valide').length;
            document.getElementById('rejectedCount').textContent = 
                profiles.filter(p => p.status === 'refuse').length;
        }

        function filterProfiles(filter) {
            currentFilter = filter;
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');
            updateStatsActive();
            renderProfiles();
        }

        function filterByStatus(status) {
            currentFilter = status;
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            updateStatsActive();
            renderProfiles();
        }

        function updateStatsActive() {
            document.querySelectorAll('.stat-item').forEach(stat => {
                stat.classList.remove('active');
            });
            if (currentFilter === 'pending' || currentFilter === 'en attente') {
                document.getElementById('stat-pending').classList.add('active');
            } else if (currentFilter === 'validated' || currentFilter === 'valide') {
                document.getElementById('stat-validated').classList.add('active');
            } else if (currentFilter === 'rejected' || currentFilter === 'refuse') {
                document.getElementById('stat-rejected').classList.add('active');
            }
        }

        function selectProfile(profileId) {
            selectedProfile = profiles.find(p => p.id === profileId);
            renderProfiles();
            showProfileDetails();
        }

        function showProfileDetails() {
            if (!selectedProfile) return;
            document.getElementById('noSelection').style.display = 'none';
            const detailsDiv = document.getElementById('profileDetails');
            detailsDiv.style.display = 'block';
            const statusText = {
                'en attente': 'En attente de validation',
                'valide': '✅ Profil validé',
                'refuse': '❌ Profil refusé'
            };
            detailsDiv.innerHTML = `
                <div class="details-header">
                    <div>
                        <h2 class="details-title">${selectedProfile.prenoms || selectedProfile.prenom || ''} ${selectedProfile.nom || ''}</h2>
                        <p style="color: #6c757d; margin-top: 5px;">
                            ${statusText[selectedProfile.status]} • 
                            ${selectedProfile.role ? selectedProfile.role.charAt(0).toUpperCase() + selectedProfile.role.slice(1) : ''}
                        </p>
                    </div>
                    ${selectedProfile.status === 'en attente' ? `
                        <div class="action-buttons">
                            <button class="btn btn-accept" onclick="validateProfile('${selectedProfile.id}')">
                                ✅ Accepter
                            </button>
                            <button class="btn btn-reject" onclick="rejectProfile('${selectedProfile.id}')">
                                ❌ Refuser
                            </button>
                        </div>
                    ` : ''}
                </div>
                <div class="info-grid">
                    <div class="info-card">
                        <div class="info-label">Informations personnelles</div>
                        <div class="info-value">
                            <strong>Nom complet:</strong> ${selectedProfile.prenoms || selectedProfile.prenom || ''} ${selectedProfile.nom || ''}<br>
                            <strong>Téléphone:</strong> ${selectedProfile.phone || selectedProfile.telephone || ''}<br>
                            <strong>Date de naissance:</strong> ${selectedProfile.dateNaissance ? new Date(selectedProfile.dateNaissance).toLocaleDateString('fr-FR') : ''}<br>
                            <strong>Date d'inscription:</strong> ${selectedProfile.dateCreation ? new Date(selectedProfile.dateCreation.seconds*1000).toLocaleDateString('fr-FR') : ''}
                        </div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">Réseaux sociaux</div>
                        <div class="social-links">
                            <a href="${selectedProfile.instagram || '#'}" target="_blank" class="btn btn-link">
                                📸 Instagram
                            </a>
                            <a href="${selectedProfile.tiktok || '#'}" target="_blank" class="btn btn-link">
                                🎵 TikTok
                            </a>
                            <a href="${selectedProfile.portfolioLink || selectedProfile.portfolio || '#'}" target="_blank" class="btn btn-link">
                                🌐 Portfolio
                            </a>
                        </div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">Centres d'intérêt</div>
                        <div class="interest-tags">
                            ${(selectedProfile.interets || []).map(interest => 
                                `<span class="interest-tag">${interest}</span>`
                            ).join('')}
                        </div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">Type de profil</div>
                        <div class="info-value">
                            <span class="profile-type ${selectedProfile.role}" style="display: inline-block; margin: 0;">
                                ${selectedProfile.role ? selectedProfile.role.charAt(0).toUpperCase() + selectedProfile.role.slice(1) : ''}
                            </span>
                            <p style="margin-top: 10px; font-size: 0.9rem; color: #6c757d;">
                                ${selectedProfile.role === 'influenceur' ? 
                                    'Créateur de contenu et influenceur sur les réseaux sociaux' : 
                                    'Commerçant proposant des produits ou services'}
                            </p>
                        </div>
                    </div>
                </div>
            `;
        }

        async function validateProfile(profileId) {
            const profileRef = db.collection('users').doc(profileId);
            await profileRef.update({ status: 'valide' });
            // Envoi du mail de félicitations
            const profile = profiles.find(p => p.id === profileId);
            if (profile && profile.email) {
                emailjs.send('service_9022822', 'template_9022822', {
                    to_email: profile.email,
                    to_name: profile.prenoms || profile.prenom || '',
                });
            }
            await fetchProfiles();
            selectedProfile = null;
            document.getElementById('profileDetails').style.display = 'none';
            document.getElementById('noSelection').style.display = 'flex';
        }

        async function rejectProfile(profileId) {
            const reason = prompt('Raison du refus (obligatoire) :');
            if (!reason) return alert('Vous devez indiquer une raison.');
            const profileRef = db.collection('users').doc(profileId);
            await profileRef.update({ status: 'refuse', reasonRefus: reason });
            // Envoi du mail de refus
            const profile = profiles.find(p => p.id === profileId);
            if (profile && profile.email) {
                emailjs.send('service_9022822', 'template_9022822', {
                    to_email: profile.email,
                    to_name: profile.prenoms || profile.prenom || '',
                    reason: reason
                });
            }
            await fetchProfiles();
            selectedProfile = null;
            document.getElementById('profileDetails').style.display = 'none';
            document.getElementById('noSelection').style.display = 'flex';
        }

        // Initialisation
        fetchProfiles();
    </script>
</body>
</html>
