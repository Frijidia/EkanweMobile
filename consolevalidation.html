<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Console de Validation - EkanweMobile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }

        .main-content {
            display: flex;
            min-height: 80vh;
        }

        .profiles-list {
            width: 40%;
            background: #f8f9fa;
            border-right: 2px solid #e9ecef;
            overflow-y: auto;
            max-height: 80vh;
        }

        .list-header {
            padding: 20px;
            background: #343a40;
            color: white;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .filter-tabs {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
            overflow-x: auto;
            padding-bottom: 5px;
            scrollbar-width: thin;
        }

        .tab {
            padding: 8px 16px;
            border: none;
            border-radius: 20px;
            background: rgba(255,255,255,0.2);
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
            white-space: nowrap;
            min-width: 90px;
        }

        .tab.active {
            background: white;
            color: #343a40;
        }

        .profile-item {
            padding: 20px;
            border-bottom: 1px solid #dee2e6;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            min-height: 100px;
            word-break: break-word;
        }

        .profile-item:hover {
            background: #e9ecef;
            transform: translateX(5px);
        }

        .profile-item.selected {
            background: #007bff;
            color: white;
        }

        .profile-header {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            gap: 6px 10px;
            margin-bottom: 10px;
        }

        .profile-name {
            font-weight: bold;
            font-size: 1.1rem;
            flex: 1;
            min-width: 0;
        }

        .profile-type, .profile-status {
            margin-top: 4px;
            margin-right: 4px;
            font-size: 0.75rem;
            padding: 3px 10px;
            border-radius: 12px;
            display: inline-block;
            max-width: 90px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .profile-type {
            margin-left: 0;
        }

        .profile-status {
            position: static;
            margin-left: 0;
        }

        .profile-status.status-pending {
            background: #ffeaa7;
            color: #d63031;
        }

        .profile-status.status-validated {
            background: #00b894;
            color: white;
        }

        .profile-status.status-rejected {
            background: #e17055;
            color: white;
        }

        .profile-info {
            font-size: 0.9rem;
            color: #6c757d;
            word-break: break-word;
            overflow-wrap: break-word;
        }

        .profile-details {
            width: 60%;
            padding: 30px;
            overflow-y: auto;
        }

        .no-selection {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #6c757d;
            text-align: center;
        }

        .no-selection .icon {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .details-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #e9ecef;
            flex-wrap: wrap;
            gap: 15px;
        }

        .details-title {
            font-size: 1.8rem;
            color: #343a40;
            margin: 0;
            flex: 1;
            min-width: 0;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
            text-align: center;
            white-space: nowrap;
        }

        .btn-accept {
            background: #00b894;
            color: white;
        }

        .btn-accept:hover {
            background: #00a085;
            transform: translateY(-2px);
        }

        .btn-reject {
            background: #e17055;
            color: white;
        }

        .btn-reject:hover {
            background: #d63031;
            transform: translateY(-2px);
        }

        .btn-link {
            background: #007bff;
            color: white;
            font-size: 0.9rem;
            padding: 8px 16px;
        }

        .btn-link:hover {
            background: #0056b3;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin-top: 20px;
        }

        .info-card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            border-left: 4px solid #007bff;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .info-label {
            font-weight: bold;
            color: #495057;
            margin-bottom: 8px;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-value {
            color: #212529;
            font-size: 1.1rem;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .social-links {
            display: flex;
            gap: 15px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .interest-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .interest-tag {
            background: #e7f3ff;
            color: #0056b3;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 0.85rem;
            font-weight: 500;
            white-space: nowrap;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            padding: 20px;
            background: #343a40;
            color: white;
            margin: 20px 0;
            border-radius: 10px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .stat-item {
            text-align: center;
            flex: 1;
            min-width: 120px;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            display: block;
        }

        .stat-label {
            font-size: 0.9rem;
            opacity: 0.8;
        }

        @media (max-width: 900px) {
            .main-content {
                flex-direction: column;
            }
            .profiles-list {
                width: 100%;
                max-height: 50vh;
            }
            .profile-details {
                width: 100%;
            }
            .info-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 600px) {
            .profile-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
            }
            .profile-type, .profile-status {
                font-size: 0.7rem;
                padding: 2px 8px;
                max-width: 100%;
            }
            .profile-item {
                padding: 10px;
                min-height: 70px;
            }
            .filter-tabs {
                gap: 6px;
            }
            .tab {
                font-size: 0.8rem;
                padding: 6px 10px;
                min-width: 70px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 Console de Validation</h1>
            <p>Gestion des profils en attente - EkanweMobile</p>
        </div>

        <div class="stats">
            <div class="stat-item">
                <span class="stat-number" id="pendingCount">0</span>
                <span class="stat-label">En attente</span>
            </div>
            <div class="stat-item">
                <span class="stat-number" id="validatedCount">0</span>
                <span class="stat-label">Validés</span>
            </div>
            <div class="stat-item">
                <span class="stat-number" id="rejectedCount">0</span>
                <span class="stat-label">Refusés</span>
            </div>
        </div>

        <div class="main-content">
            <div class="profiles-list">
                <div class="list-header">
                    <h3>📋 Liste des Profils</h3>
                    <div class="filter-tabs">
                        <button class="tab active" onclick="filterProfiles('all')">Tous</button>
                        <button class="tab" onclick="filterProfiles('influenceur')">Influenceurs</button>
                        <button class="tab" onclick="filterProfiles('commercant')">Commerçants</button>
                        <button class="tab" onclick="filterProfiles('pending')">En attente</button>
                        <button class="tab" onclick="filterProfiles('validated')">Validés</button>
                        <button class="tab" onclick="filterProfiles('rejected')">Refusés</button>
                    </div>
                </div>
                <div id="profilesList">
                    <!-- Les profils seront générés ici -->
                </div>
            </div>

            <div class="profile-details">
                <div class="no-selection" id="noSelection">
                    <div class="icon">👤</div>
                    <h3>Aucun profil sélectionné</h3>
                    <p>Cliquez sur un profil dans la liste pour voir ses détails</p>
                </div>
                <div id="profileDetails" style="display: none;">
                    <!-- Les détails du profil seront affichés ici -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // Données d'exemple des profils
        let profiles = [
            {
                id: 1,
                nom: "Kouassi",
                prenom: "Marie",
                type: "influenceur",
                status: "pending",
                telephone: "+225 07 12 34 56 78",
                dateNaissance: "1995-03-15",
                centresInteret: ["Mode", "Beauté", "Lifestyle"],
                instagram: "https://instagram.com/marie_kouassi",
                tiktok: "https://tiktok.com/@mariek_style",
                portfolio: "https://marie-portfolio.com",
                dateInscription: "2024-12-15"
            },
            {
                id: 2,
                nom: "Traore",
                prenom: "Ibrahim",
                type: "commercant",
                status: "pending",
                telephone: "+225 05 87 65 43 21",
                dateNaissance: "1988-07-22",
                centresInteret: ["Électronique", "Tech", "Business"],
                instagram: "https://instagram.com/ibrahim_tech",
                tiktok: "https://tiktok.com/@ibrahim_store",
                portfolio: "https://ibrahim-electronics.com",
                dateInscription: "2024-12-16"
            },
            {
                id: 3,
                nom: "Aya",
                prenom: "Fatou",
                type: "influenceur",
                status: "validated",
                telephone: "+225 01 23 45 67 89",
                dateNaissance: "1992-11-08",
                centresInteret: ["Cuisine", "Food", "Recettes"],
                instagram: "https://instagram.com/fatou_cuisine",
                tiktok: "https://tiktok.com/@fatou_chef",
                portfolio: "https://fatou-recipes.com",
                dateInscription: "2024-12-10"
            },
            {
                id: 4,
                nom: "Kone",
                prenom: "Sekou",
                type: "commercant",
                status: "rejected",
                telephone: "+225 02 34 56 78 90",
                dateNaissance: "1985-04-30",
                centresInteret: ["Vêtements", "Fashion", "Import"],
                instagram: "https://instagram.com/sekou_fashion",
                tiktok: "https://tiktok.com/@sekou_clothes",
                portfolio: "https://sekou-boutique.com",
                dateInscription: "2024-12-05"
            },
            {
                id: 5,
                nom: "Bamba",
                prenom: "Aminata",
                type: "influenceur",
                status: "pending",
                telephone: "+225 03 45 67 89 01",
                dateNaissance: "1996-09-12",
                centresInteret: ["Fitness", "Sport", "Wellness"],
                instagram: "https://instagram.com/aminata_fit",
                tiktok: "https://tiktok.com/@aminata_sport",
                portfolio: "https://aminata-wellness.com",
                dateInscription: "2024-12-18"
            }
        ];

        let currentFilter = 'all';
        let selectedProfile = null;

        function renderProfiles() {
            const profilesList = document.getElementById('profilesList');
            const filteredProfiles = profiles.filter(profile => {
                if (currentFilter === 'all') return true;
                if (currentFilter === 'influenceur') return profile.type === 'influenceur';
                if (currentFilter === 'commercant') return profile.type === 'commercant';
                return profile.status === currentFilter;
            });

            profilesList.innerHTML = filteredProfiles.map(profile => `
                <div class="profile-item ${selectedProfile?.id === profile.id ? 'selected' : ''}" 
                     onclick="selectProfile(${profile.id})">
                    <div class="profile-status status-${profile.status}">
                        ${profile.status === 'pending' ? 'En attente' : 
                          profile.status === 'validated' ? 'Validé' : 'Refusé'}
                    </div>
                    <div class="profile-header">
                        <div class="profile-name">${profile.prenom} ${profile.nom}</div>
                        <span class="profile-type ${profile.type}">${profile.type}</span>
                    </div>
                    <div class="profile-info">
                        📞 ${profile.telephone}<br>
                        📅 Inscrit le ${new Date(profile.dateInscription).toLocaleDateString('fr-FR')}
                    </div>
                </div>
            `).join('');

            updateStats();
        }

        function updateStats() {
            document.getElementById('pendingCount').textContent = 
                profiles.filter(p => p.status === 'pending').length;
            document.getElementById('validatedCount').textContent = 
                profiles.filter(p => p.status === 'validated').length;
            document.getElementById('rejectedCount').textContent = 
                profiles.filter(p => p.status === 'rejected').length;
        }

        function filterProfiles(filter) {
            currentFilter = filter;
            
            // Mettre à jour les onglets
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');
            
            renderProfiles();
        }

        function selectProfile(profileId) {
            selectedProfile = profiles.find(p => p.id === profileId);
            renderProfiles();
            showProfileDetails();
        }

        function showProfileDetails() {
            if (!selectedProfile) return;

            document.getElementById('noSelection').style.display = 'none';
            const detailsDiv = document.getElementById('profileDetails');
            detailsDiv.style.display = 'block';

            const statusText = {
                'pending': 'En attente de validation',
                'validated': '✅ Profil validé',
                'rejected': '❌ Profil refusé'
            };

            detailsDiv.innerHTML = `
                <div class="details-header">
                    <div>
                        <h2 class="details-title">${selectedProfile.prenom} ${selectedProfile.nom}</h2>
                        <p style="color: #6c757d; margin-top: 5px;">
                            ${statusText[selectedProfile.status]} • 
                            ${selectedProfile.type.charAt(0).toUpperCase() + selectedProfile.type.slice(1)}
                        </p>
                    </div>
                    ${selectedProfile.status === 'pending' ? `
                        <div class="action-buttons">
                            <button class="btn btn-accept" onclick="validateProfile(${selectedProfile.id})">
                                ✅ Accepter
                            </button>
                            <button class="btn btn-reject" onclick="rejectProfile(${selectedProfile.id})">
                                ❌ Refuser
                            </button>
                        </div>
                    ` : ''}
                </div>

                <div class="info-grid">
                    <div class="info-card">
                        <div class="info-label">Informations personnelles</div>
                        <div class="info-value">
                            <strong>Nom complet:</strong> ${selectedProfile.prenom} ${selectedProfile.nom}<br>
                            <strong>Téléphone:</strong> ${selectedProfile.telephone}<br>
                            <strong>Date de naissance:</strong> ${new Date(selectedProfile.dateNaissance).toLocaleDateString('fr-FR')}<br>
                            <strong>Date d'inscription:</strong> ${new Date(selectedProfile.dateInscription).toLocaleDateString('fr-FR')}
                        </div>
                    </div>

                    <div class="info-card">
                        <div class="info-label">Réseaux sociaux</div>
                        <div class="social-links">
                            <a href="${selectedProfile.instagram}" target="_blank" class="btn btn-link">
                                📸 Instagram
                            </a>
                            <a href="${selectedProfile.tiktok}" target="_blank" class="btn btn-link">
                                🎵 TikTok
                            </a>
                            <a href="${selectedProfile.portfolio}" target="_blank" class="btn btn-link">
                                🌐 Portfolio
                            </a>
                        </div>
                    </div>

                    <div class="info-card">
                        <div class="info-label">Centres d'intérêt</div>
                        <div class="interest-tags">
                            ${selectedProfile.centresInteret.map(interest => 
                                `<span class="interest-tag">${interest}</span>`
                            ).join('')}
                        </div>
                    </div>

                    <div class="info-card">
                        <div class="info-label">Type de profil</div>
                        <div class="info-value">
                            <span class="profile-type ${selectedProfile.type}" style="display: inline-block; margin: 0;">
                                ${selectedProfile.type.charAt(0).toUpperCase() + selectedProfile.type.slice(1)}
                            </span>
                            <p style="margin-top: 10px; font-size: 0.9rem; color: #6c757d;">
                                ${selectedProfile.type === 'influenceur' ? 
                                    'Créateur de contenu et influenceur sur les réseaux sociaux' : 
                                    'Commerçant proposant des produits ou services'}
                            </p>
                        </div>
                    </div>
                </div>
            `;
        }

        function validateProfile(profileId) {
            const profile = profiles.find(p => p.id === profileId);
            if (profile) {
                profile.status = 'validated';
                renderProfiles();
                showProfileDetails();
                alert(`✅ Profil de ${profile.prenom} ${profile.nom} validé avec succès !`);
            }
        }

        function rejectProfile(profileId) {
            const profile = profiles.find(p => p.id === profileId);
            if (profile) {
                const reason = prompt('Raison du refus (optionnel):');
                profile.status = 'rejected';
                renderProfiles();
                showProfileDetails();
                alert(`❌ Profil de ${profile.prenom} ${profile.nom} refusé.`);
            }
        }

        // Initialisation
        renderProfiles();
    </script>
</body>
</html>
